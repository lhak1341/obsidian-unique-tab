name: Smart Release Obsidian Plugin

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # e.g. 1.0.5
      - name: Get version from manifest.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "pkg_version=$VERSION" >> $GITHUB_OUTPUT

      # Tags are the bare version, no "v" prefix
      - name: Check if Release exists
        id: check_release
        run: |
          VERSION=${{ steps.get_version.outputs.pkg_version }}
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION already exists, skipping."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check_release.outputs.exists == 'false'
        run: bun install --frozen-lockfile

      - name: Build plugin
        if: steps.check_release.outputs.exists == 'false'
        run: bun run build

      - name: Create Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.pkg_version }}
          name: ${{ steps.get_version.outputs.pkg_version }}
          files: |
            main.js
            manifest.json
            styles.css
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
